plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.devicekey'
version = '0.1.0'

android {
  namespace "expo.modules.devicekey"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // BiometricPrompt with a CryptoObject: the Keystore only releases the key for one signature
  // after the user authenticates.
  implementation "androidx.biometric:biometric:1.1.0"
}
