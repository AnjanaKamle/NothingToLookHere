# Local development database only. Do not reuse these settings in production.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      # Error log lines omit DETAIL, which would otherwise dump the failing row (emails, hashes).
      # Statements are logged with $n placeholders only; parameter values are never logged.
      - -c
      - log_error_verbosity=terse
      # I/O timing in EXPLAIN (ANALYZE, BUFFERS) output (dbms/05_query_timings.md).
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
    ports:
      # Bound to loopback so the database is not exposed on your network.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18+ images mount at /var/lib/postgresql (PGDATA is versioned beneath it).
      - capstone-pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    shm_size: 128mb

volumes:
  capstone-pgdata:
